# Kizzey Web + the optional Discord voice service.
#
#   1. copy this file next to .env and set:
#        DISCORD_TOKEN=your-bot-token
#        KIZZEY_VOICE_TOKEN=some-long-random-string
#   2. docker compose up --build
#
# Kizzey stays on port 8420. The voice service is only reachable on the compose
# network; the browser never talks to it directly.
services:
  kizzey:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      KIZZEY_HOST: 0.0.0.0
      KIZZEY_PORT: "8420"
      KIZZEY_VOICE_URL: http://voice:8421
      KIZZEY_VOICE_TOKEN: ${KIZZEY_VOICE_TOKEN:-change-me}
    ports:
      - "8420:8420"
    volumes:
      - kizzey-data:/app/data
    depends_on:
      - voice
    restart: unless-stopped

  voice:
    build:
      context: .
      dockerfile: voice_service/Dockerfile
    environment:
      VOICE_HOST: 0.0.0.0
      VOICE_PORT: "8421"
      VOICE_TOKEN: ${KIZZEY_VOICE_TOKEN:-change-me}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      VOICE_MEMBERS_INTENT: ${VOICE_MEMBERS_INTENT:-}
      VOICE_RECORDINGS_DIR: /data/voice_recordings
    volumes:
      - voice-recordings:/data/voice_recordings
    restart: unless-stopped

volumes:
  kizzey-data:
  voice-recordings: